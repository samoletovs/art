<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbf7f0" />
<title>art · naurolabs</title>
<meta name="description" content="A small gallery of art pages, hosted on naurolabs.com." />

<style>
  :root {
    --bg: #fbf7f0;          /* warm paper */
    --ink: #1c1a17;         /* near-black charcoal */
    --muted: #8a847a;       /* graphite */
    --rule: #e6dfd2;        /* soft divider */
    --accent: #9E3039;      /* nauroLabs red */
    --card: #ffffff;
    --shadow: 0 1px 2px rgba(28, 26, 23, 0.04), 0 8px 24px rgba(28, 26, 23, 0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; }

  .page {
    max-width: 920px;
    margin: 0 auto;
    padding: clamp(40px, 6vw, 88px) clamp(20px, 4vw, 48px) 64px;
  }

  /* Masthead */
  header.mast {
    margin-bottom: clamp(48px, 7vw, 88px);
  }
  .eyebrow {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  h1 {
    font-size: clamp(40px, 7vw, 72px);
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
    font-weight: 500;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .lede {
    max-width: 56ch;
    color: var(--muted);
    margin: 0;
    font-size: 19px;
  }

  /* Section heading */
  h2.section {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--rule);
    padding-top: 28px;
    margin: 56px 0 24px;
    font-weight: 500;
  }

  /* Pieces grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .piece {
    display: block;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 28px 24px;
    min-height: 160px;
    transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
  }
  .piece:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: transparent;
  }
  .piece .num {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .piece .title {
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .piece .meta {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: var(--muted);
  }

  /* Empty state */
  .empty {
    border: 1px dashed var(--rule);
    border-radius: 4px;
    padding: 48px 32px;
    text-align: center;
    color: var(--muted);
  }
  .empty p { margin: 0 0 8px; }
  .empty code {
    background: rgba(28, 26, 23, 0.04);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.92em;
  }

  /* Footer */
  footer.foot {
    margin-top: 88px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  footer.foot a {
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
  }
  footer.foot .brand {
    color: var(--ink);
  }
  footer.foot .brand b { color: var(--accent); font-weight: 600; }

  @media (prefers-color-scheme: dark) {
    /* Optional gentle dark mode; kept restrained so the gallery doesn't shout. */
    :root {
      --bg: #15130f;
      --ink: #f3eee3;
      --muted: #8a847a;
      --rule: #2a2620;
      --accent: #c9555e;
      --card: #1c1a16;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }

  /* ──────────────────────────────────────────
     Lightbox modal
     ────────────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 26, 23, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }

  .modal {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow: auto;
    position: relative;
    box-shadow: 0 24px 64px rgba(28, 26, 23, 0.22);
    outline: none;
  }

  .modal-preview {
    width: 100%;
    height: 260px;
    overflow: hidden;
    background: var(--rule);
    position: relative;
    border-radius: 5px 5px 0 0;
  }
  .modal-iframe {
    width: 333%;
    height: 333%;
    border: none;
    pointer-events: none;
    display: block;
    transform: scale(0.3);
    transform-origin: top left;
  }

  .modal-body {
    padding: 28px 32px 32px;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--rule);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    transition: background 150ms ease;
  }
  .modal-close:hover { background: var(--card); }

  @media (prefers-color-scheme: dark) {
    .modal-close { background: rgba(28, 26, 22, 0.85); }
    .modal-close:hover { background: var(--card); }
  }

  .modal-num {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .modal-title {
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    font-weight: 500;
  }
  .modal-meta {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .modal-desc {
    font-size: 16px;
    color: var(--ink);
    margin: 0 0 28px;
    line-height: 1.6;
  }
  .modal-open-btn {
    display: inline-block;
    text-decoration: none;
    background: var(--accent);
    color: #fff;
    padding: 10px 26px;
    border-radius: 3px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    transition: opacity 150ms ease;
  }
  .modal-open-btn:hover { opacity: 0.85; }
</style>
</head>

<body>
<main class="page">

  <header class="mast">
    <p class="eyebrow">art . naurolabs . com</p>
    <h1>A small <em>gallery</em>.</h1>
    <p class="lede">
      Pages, sketches, and experiments.
      Each piece is its own little corner of the web — open one to step inside.
    </p>
  </header>

  <h2 class="section">Pieces</h2>

  <!--
    To add a new piece:
    1. Save the HTML file in this folder, e.g. "rooftop-rain.html"
    2. Copy one of the <a class="piece"> blocks below and edit href + title + meta
    3. Or leave the empty state — it will hide itself once a piece exists.
  -->

  <div class="grid">

    <a class="piece" href="rococo.html"
       data-description="Lightness, ornament, and wit. Pastel palettes, gilded asymmetry, and the art of pleasure — a curated Rococo style guide with interactive colour themes.">
      <div class="num">No. 01</div>
      <div class="title">Rococo</div>
      <div class="meta">c. 1720–1780 — style guide</div>
    </a>

    <a class="piece" href="baroque.html"
       data-description="Drama, grandeur, and chiaroscuro. Rich shadows, golden light, and theatrical intensity — an immersive Baroque style guide with six dark palettes.">
      <div class="num">No. 02</div>
      <div class="title">Baroque</div>
      <div class="meta">c. 1600–1750 — style guide</div>
    </a>

  </div>

  <footer class="foot">
    <span class="brand">built by nauro<b>Labs</b></span>
    <a href="https://naurolabs.com" rel="noopener">naurolabs.com</a>
  </footer>

</main>

<!-- Lightbox modal -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <button class="modal-close" id="modal-close" aria-label="Close preview">&#x2715;</button>
    <div class="modal-preview">
      <iframe class="modal-iframe" id="modal-iframe" title="Artwork preview" src=""></iframe>
    </div>
    <div class="modal-body">
      <div class="modal-num"   id="modal-num"></div>
      <h2  class="modal-title" id="modal-title"></h2>
      <p   class="modal-meta"  id="modal-meta"></p>
      <p   class="modal-desc"  id="modal-desc"></p>
      <a   class="modal-open-btn" id="modal-open-btn" href="#">Open piece →</a>
    </div>
  </div>
</div>

<script>
(function () {
  var overlay  = document.getElementById('modal-overlay');
  var modal    = document.getElementById('modal');
  var iframe   = document.getElementById('modal-iframe');
  var numEl    = document.getElementById('modal-num');
  var titleEl  = document.getElementById('modal-title');
  var metaEl   = document.getElementById('modal-meta');
  var descEl   = document.getElementById('modal-desc');
  var openBtn  = document.getElementById('modal-open-btn');
  var closeBtn = document.getElementById('modal-close');

  function openModal(card) {
    var href  = card.getAttribute('href');
    var num   = card.querySelector('.num').textContent;
    var title = card.querySelector('.title').textContent;
    var meta  = card.querySelector('.meta').textContent;
    var desc  = card.getAttribute('data-description') || '';

    numEl.textContent  = num;
    titleEl.textContent = title;
    metaEl.textContent = meta;
    descEl.textContent = desc;
    openBtn.setAttribute('href', href);
    iframe.src = href;

    overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
    modal.focus();
  }

  function closeModal() {
    overlay.setAttribute('hidden', '');
    iframe.src = '';
    document.body.style.overflow = '';
  }

  document.querySelectorAll('a.piece').forEach(function (card) {
    card.addEventListener('click', function (e) {
      e.preventDefault();
      openModal(card);
    });
  });

  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) { closeModal(); }
  });

  closeBtn.addEventListener('click', closeModal);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.hasAttribute('hidden')) {
      closeModal();
    }
  });
}());
</script>

</body>
</html>
